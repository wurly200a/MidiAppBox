# scripts/device-regress.sh の設定(bash として source される)。

# 回帰対象。Phase 12 作業 2 で 6 本に絞り(判断根拠は docs/results/phase12.md)、
# Phase 14 で clicktest を削除して 5 本(判断根拠は docs/results/phase14.md)。
APPS="touch_demo mp3player metronome midi_loopback seq_smoke"

# 起動から stop を送るまでの保持秒数(既定)。
HOLD_SEC=6

# アプリごとの保持秒数の上書き。seq_smoke は 8 小節の自己検査を一巡させる。
declare -A HOLD_OVERRIDE=(
    [seq_smoke]=20
)

# 許容する WARN/ERROR 行(1 行 1 正規表現)。ここに当たらない W/E 行は不合格。
# - I2C の nack はボードリセット直後の既知ノイズ(Touch online より前)。
# - ring buffer full は MIDI ループバック配線をしているときだけ出る。
# 注: Phase 11 まで許容していた "spi_flash: Detected size(16384k) larger than ..." は
#     Phase 12 作業 1(フラッシュサイズ 16MB 化)で出なくなったので不要。
ALLOW_PATTERNS=(
    'I2C transaction unexpected nack detected'
    'MIDI RX: ring buffer full'
)

# アプリごとの許容 free heap 差分(終了 - 開始)。指定が無ければ 0 を要求する。
#
# mp3player の既知の -44B について: Phase 12 作業 3 で、これは **MP3 を実際に再生した
# ときだけ**現れることを実測した(無操作で 35 秒保持しても +0。手動回帰で -44 が出て
# いたのは、実行中にユーザーが再生ボタンをタップしていたため)。本スクリプトは
# アプリ内 UI 操作を行わない(v1 のスコープ外)ので、全アプリ 0 を要求する。
# **再生経路まで含めた回帰が要るときは、docs/workflow.md §3.3 の人間操作+カメラで
# 実施すること。** そこでは mp3player に -44B が出るのが正常。
declare -A EXPECT_DELTA=()

# --- 余裕の監視: 下限しきい値 ------------------------------------------------
#
# **固定値一致にしない**(Phase 15)。largest_int はアプリごとに違いうる
# (linear memory は PSRAM へ出たが、.wasm バッファやアプリ固有の native 確保は
# internal に残る)。単一の期待値を全アプリに当てると「毎回 FAIL だが実は PASS」を
# 別の形で作り直すことになる。厳密な一致を見たいのはリーク検出の方で、それは
# 下の差分で見る。この 2 つを混ぜていたのが Phase 14 までの設計の弱点だった。
#
# 実測(Phase 15 ステップ 2。PSRAM 有効 / CAPS_ALLOC / psram_dma_direct=1):
#   free_int 105,880 / largest_int 57,344 / free_psram 8,316,904(5 アプリとも同一)
#
# MIN_LARGEST_INT は PSRAM 化前の平常値 31,744 を下回らない線に置く。
MIN_FREE_INT=80000
MIN_LARGEST_INT=32768
MIN_FREE_PSRAM=8000000

# --- リーク検出: 開始と終了の差分 --------------------------------------------
#
# PSRAM は 8MB あるので、下限しきい値より差分の方が実質的な監視になる。
# WASM の linear memory は PSRAM から取られる(Phase 15)ので、ここを見ないと
# アプリの load/unload を繰り返したときの PSRAM リークに気づけない。
declare -A EXPECT_DELTA_PSRAM=()
